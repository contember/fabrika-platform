name: platform

# Upgrades the fabrika installation in AWS account {{ACCOUNT_ID}}, {{REGION}}. THIS repository is the
# installation's root of trust for upgrades: its workflow takes the installation's deployer role, so the
# platform never upgrades itself (ADR-0025).
#
# IT UPGRADES AN INSTALLATION THAT ALREADY EXISTS. It never creates one: `fabrika platform install
# --provider=aws` makes it, from the operator's machine with the operator's own credentials.
#
# NO KEY IS STORED ANYWHERE. The job takes the role `{{ROLE_ARN}}` through GitHub's OIDC provider: AWS
# gives it to a job of this repository running in the `{{ENVIRONMENT}}` GitHub Environment alone, compared
# by GitHub's ids. The role is an administrator inside the installation's ceiling: it may make no IAM
# user, key or identity provider, and may neither widen nor re-trust itself. Whoever can run this job in
# that Environment can still do what the platform's stacks can.
#
# PROTECT THE ENVIRONMENT. Settings -> Environments -> {{ENVIRONMENT}}: restrict it to `main` (init does,
# where the plan offers it) and ADD A REQUIRED REVIEWER, so a person approves every run before the role
# is taken. `fabrika platform init --provider=aws` prints the command that adds you.
#
# Generated by `fabrika platform init --provider=aws`, which rewrites this file: an edit here does not
# last. contember/fabrika-platform is public and checked out tokenless at the TAG pinned in
# `fabrika.ref`. Bump that tag and push to upgrade this installation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only a version bump (or a workflow edit) upgrades: not a README tweak.
    paths: ['fabrika.ref', '.github/workflows/platform.yml']

concurrency:
  group: platform-upgrade
  cancel-in-progress: false

permissions:
  contents: read
  # The OIDC token the deployer role is taken with; nothing else.
  id-token: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    # An upgrade that builds both images and rolls every service; the role's session lasts three hours.
    timeout-minutes: 170
    environment: {{ENVIRONMENT}}
    steps:
      - name: Checkout this repository (the pinned ref and this workflow)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the pinned fabrika tag
        id: ref
        # A published TAG, never a branch, selects the release.
        run: |
          ref="$(tr -d '[:space:]' < fabrika.ref)"
          case "$ref" in
            v[0-9]*) ;;
            *)
              echo "fabrika.ref must pin a published tag such as v0.1.0, not '$ref'." >&2
              exit 1
              ;;
          esac
          echo "fabrika=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout contember/fabrika-platform@${{ steps.ref.outputs.fabrika }}
        env:
          PINNED_REF: ${{ steps.ref.outputs.fabrika }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git clone --no-checkout https://github.com/contember/fabrika-platform.git fabrika-platform
          git -C fabrika-platform checkout --detach "refs/tags/$PINNED_REF"

      - name: Record the resolved source commit
        id: source
        working-directory: fabrika-platform
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the Bun release of the pinned tag
        id: bun
        working-directory: fabrika-platform
        env:
          PINNED_REF: ${{ steps.ref.outputs.fabrika }}
        run: |
          version="$(tr -d '[:space:]' < .bun-version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "fabrika-platform@$PINNED_REF names no exact Bun release in .bun-version: '$version'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # Installed before the role is taken: no dependency's script ever runs with AWS credentials.
      - name: Install fabrika
        working-directory: fabrika-platform
        run: bun install --frozen-lockfile

      - name: Put the fabrika workspace bin on PATH
        working-directory: fabrika-platform
        run: |
          if [ ! -x node_modules/.bin/fabrika ]; then
            echo "fabrika-platform@${{ steps.ref.outputs.fabrika }} installed no \`fabrika\` binary." >&2
            exit 1
          fi
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Take the deployer role
        # Pinned by commit: this step handles the installation's credentials.
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.FABRIKA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.FABRIKA_AWS_REGION }}
          allowed-account-ids: ${{ vars.FABRIKA_AWS_ACCOUNT_ID }}
          role-session-name: fabrika-platform-upgrade
          role-duration-seconds: 10800
          role-skip-session-tagging: true

      - name: Upgrade the platform
        id: platform
        working-directory: fabrika-platform
        env:
          # The account and region the role was taken in; the command checks the credentials are that account's.
          FABRIKA_AWS_ACCOUNT_ID: ${{ vars.FABRIKA_AWS_ACCOUNT_ID }}
          FABRIKA_AWS_REGION: ${{ vars.FABRIKA_AWS_REGION }}
          # The release: the pinned tag's commit, and the Bun image applications build from, by digest.
          FABRIKA_PLATFORM_COMMIT: ${{ steps.source.outputs.commit }}
          FABRIKA_AWS_BASE_IMAGE: ${{ vars.FABRIKA_AWS_BASE_IMAGE }}
        # Every other choice is the installation's own, read from its record. A release that changes the
        # installation's ceilings stops here: the operator runs that upgrade once with their own credentials.
        run: fabrika platform upgrade --provider=aws --yes

      - name: Summary
        if: always()
        run: |
          {
            echo "### platform upgrade (aws)"
            echo ""
            echo "- fabrika tag: \`${{ steps.ref.outputs.fabrika || '(unresolved)' }}\`"
            echo "- source commit: \`${{ steps.source.outputs.commit || '(unresolved)' }}\`"
            echo "- platform upgrade: \`${{ steps.platform.outcome || 'not run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
