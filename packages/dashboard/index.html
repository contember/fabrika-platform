<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Fabrika Console</title>
	<script>
		// Apply a pinned theme before first paint. With no pin the stylesheet's light-dark() follows the OS.
		try {
			var t = localStorage.getItem('fabrika.console.theme')
			if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
		} catch (_) {}
	</script>
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>
</html>
