# The browser stack runs the same services as `compose.yaml` with the same authentication path. It
# differs in exactly one thing: IAM's local login bypass is off, because a suite that cannot present
# an unauthenticated browser cannot prove the proxy refuses one. Sessions come from real `sessions`
# rows seeded by `packages/iam/src/node/browser-identity.ts`, so nothing else needs the bypass.
services:
  iam:
    environment:
      LOCAL_DEV_LOGIN: ""

  operations:
    extra_hosts:
      - "errors.fabrika.localhost:127.0.0.1"

  notes:
    environment:
      FABRIKA_OPERATIONS_DSN: "${FABRIKA_BROWSER_OPERATIONS_DSN:-http://00000000000000000000000000000000@errors.fabrika.localhost:18080/1}"
      FABRIKA_RELEASE: "${FABRIKA_BROWSER_RELEASE:-fabrika/browser-notes/test/default/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}"
