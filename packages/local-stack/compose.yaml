name: fabrika-local

x-bun: &bun
  image: oven/bun:1.3.14-alpine
  working_dir: /workspace
  volumes:
    - ../..:/workspace

# The installation's mail transport in this composition, which Control holds: a deploy hands it only to an application
# whose job declares `mailer: 'installation'`, and the `directory` provider writes each message to `.state/mail/`. IAM
# holds the same set as its switch for delivery and hands its mail to Control's relay. Only the local IAM and Control
# compositions and an application under a loopback issuer accept that provider.
x-local-mail: &local-mail
  FABRIKA_EMAIL_PROVIDER: directory
  FABRIKA_EMAIL_FROM: Fabrika local <mail@local.test>
  FABRIKA_EMAIL_DIRECTORY: /workspace/packages/local-stack/.state/mail

services:
  platform-db:
    image: postgres:17-alpine
    env_file: .state/platform-db.env
    volumes:
      - platform-db:/var/lib/postgresql/data
      - ./postgres/platform-init.sql:/docker-entrypoint-initdb.d/00-platform.sql:ro
    networks: [platform]
    healthcheck:
      # Over TCP, and naming a database `platform-init.sql` creates. The entrypoint runs a temporary
      # server on the unix socket while it applies that script, so a socket probe reports healthy
      # before the databases exist and IAM starts against a server that is about to shut down.
      test: [CMD-SHELL, pg_isready -U postgres -h 127.0.0.1 -d operations]
      interval: 2s
      timeout: 2s
      retries: 30

  apps-db:
    image: postgres:17-alpine
    env_file: .state/apps-db.env
    volumes:
      - apps-db:/var/lib/postgresql/data
    networks: [apps-prod]
    healthcheck:
      # See platform-db: TCP only, so the initdb-time socket server cannot answer for it.
      test: [CMD-SHELL, pg_isready -U postgres -h 127.0.0.1 -d notes]
      interval: 2s
      timeout: 2s
      retries: 30

  object-storage:
    image: chrislusf/seaweedfs:4.42
    command: >-
      mini -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/identities.json
      -s3.autoCreateBucket=false -master.telemetry=false
    environment:
      S3_BUCKET: run-logs,operations-payloads
    volumes:
      - object-storage:/data
      - ./.state/object-storage-identities.json:/etc/seaweedfs/identities.json:ro
    networks: [platform]
    healthcheck:
      # S3 accepts connections before startup bucket creation finishes.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/run-logs/?limit=1' &&
          curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/operations-payloads/?limit=1'
      interval: 2s
      timeout: 3s
      retries: 30

  zerops-emulator:
    <<: *bun
    command: bun packages/local-stack/src/emulator-server.ts
    env_file: .state/emulator.env
    environment:
      PORT: "3000"
      LOCAL_ZEROPS_ACTIVATION_DELAY_MS: "10000"
      LOCAL_ZEROPS_STATE_FILE: /state/zerops.json
    volumes:
      - ../..:/workspace
      - zerops-state:/state
    networks: [platform]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  iam:
    <<: *bun
    # The production server with the `directory` provider registered (`src/iam-server.ts`); its mail goes through Control.
    command: [sh, -c, "bun packages/iam/src/node/migrate.ts && exec bun packages/local-stack/src/iam-server.ts"]
    # `iam-oauth.env` is rewritten by every prepare: empty unless FABRIKA_LOCAL_MCP_CLIENTS_JSON is set.
    env_file:
      - path: .state/iam.env
      - path: .state/iam-oauth.env
        required: false
    environment:
      <<: *local-mail
      PORT: "18080"
      ENVIRONMENT: local
      ISSUER: http://iam.fabrika.localhost:18080
      # IAM's own local bypass: `/auth/login` mints a real session row for the bootstrap admin instead
      # of calling an external IdP. It is refused at USE the moment this is off.
      LOCAL_DEV_LOGIN: "true"
      FABRIKA_IAM_OIDC_ENABLED: "false"
      FABRIKA_IAM_PASSWORD_ENABLED: "true"
      # With a provider configured, IAM sends through Control's mail relay, as on Zerops.
      FABRIKA_CONTROL_URL: http://control:3000
      HUMAN_EMAIL_DOMAINS: "[]"
      HUMAN_EMAILS: "[]"
      IAM_BOOTSTRAP_ADMINS: '["admin@local.test"]'
    networks:
      platform:
        aliases: [iam.fabrika.localhost]
    depends_on:
      platform-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:18080/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  control:
    <<: *bun
    # The production server with its GitHub and upload transports pointed at the local fixtures (ADR-0029).
    command: [sh, -c, "bun packages/control/src/zerops/migrate.ts && bun packages/local-stack/src/source-connection-fixture-seed.ts && exec bun packages/local-stack/src/control-server.ts"]
    # `control-table.env` is rewritten by every prepare: the digest of the table the platform proxy publishes for it.
    env_file:
      - path: .state/control.env
      - path: .state/control-table.env
    environment:
      <<: *local-mail
      PORT: "3000"
      FABRIKA_CONTROL_ASSETS_DIR: packages/dashboard/dist
      ENVIRONMENT: local
      FABRIKA_CONTROL_DOMAIN: http://control.fabrika.localhost:18080
      FABRIKA_CONTROL_BOOTSTRAP_ADMINS: "[]"
      FABRIKA_IAM_ISSUER: http://iam.fabrika.localhost:18080
      FABRIKA_IAM_RPC_URL: http://iam:18080
      FABRIKA_OPERATIONS_URL: http://operations:3000
      OPERATIONS_ARTIFACT_ORIGIN: http://errors.fabrika.localhost:18080
      FABRIKA_CONTROL_RUN_LOGS_BUCKET: run-logs
      FABRIKA_CONTROL_RUN_LOGS_ENDPOINT: http://object-storage:9000
      FABRIKA_CONTROL_RUN_LOGS_REGION: us-east-1
      FABRIKA_ZEROPS_API_BASE_URL: http://zerops-emulator:3000/api/rest/public
      FABRIKA_ZEROPS_CLIENT_ID: local-client
      FABRIKA_ZEROPS_PROXY_IAM_URL: http://iam.fabrika.localhost:18080
    networks: [platform]
    depends_on:
      platform-db:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      iam:
        condition: service_healthy
      operations:
        condition: service_healthy
      zerops-emulator:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  operations:
    <<: *bun
    command: [sh, -c, "bun packages/operations/src/node/migrate.ts && exec bun packages/operations/src/node/server.ts"]
    env_file: .state/operations.env
    environment:
      PORT: "3000"
      ENVIRONMENT: local
      FABRIKA_OPERATIONS_PUBLIC_HOST: errors.fabrika.localhost
      FABRIKA_OPERATIONS_BLOB_BUCKET: operations-payloads
      FABRIKA_OPERATIONS_BLOB_ENDPOINT: http://object-storage:9000
      FABRIKA_OPERATIONS_BLOB_REGION: us-east-1
      FABRIKA_IAM_RPC_URL: http://iam:18080
      FABRIKA_CONTROL_URL: http://control:3000
      FABRIKA_IAM_ISSUER: http://iam.fabrika.localhost:18080
    networks: [platform]
    depends_on:
      platform-db:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      iam:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  platform-proxy-auth:
    <<: *bun
    command: bun packages/proxy/src/main.ts
    env_file: .state/platform-proxy.env
    environment:
      FABRIKA_PROXY_MANIFEST: /local-state/platform-proxy.manifest.json
      FABRIKA_PROXY_PORT: "9000"
      FABRIKA_IAM_ISSUER: http://iam.fabrika.localhost:18080
    volumes:
      - ../..:/workspace
      - ./.state:/local-state:ro
    networks:
      platform: {}
      edge:
        aliases: [iam.fabrika.localhost]
      iam-public:
        aliases: [iam.fabrika.localhost]
    ports:
      - 127.0.0.1:18080:18080
    depends_on:
      iam:
        condition: service_healthy
      control:
        condition: service_healthy
      operations:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9000/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  platform-proxy:
    image: caddy:2.10.2-alpine
    command: caddy run --config /local-state/platform-caddy.json
    network_mode: service:platform-proxy-auth
    volumes:
      - ./.state:/local-state:ro
    depends_on:
      platform-proxy-auth:
        condition: service_healthy

  # The apps network's own object storage, as a namespace's application holds a bucket of its own: the app never
  # reaches the platform's storage. It holds the Notes example's `attachments` bucket only.
  apps-storage:
    image: chrislusf/seaweedfs:4.42
    command: >-
      mini -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/identities.json
      -s3.autoCreateBucket=false -master.telemetry=false
    environment:
      S3_BUCKET: notes-files
    volumes:
      - apps-storage:/data
      - ./.state/apps-storage-identities.json:/etc/seaweedfs/identities.json:ro
    networks: [apps-prod]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/notes-files/?limit=1'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Notes example as the platform starts a contract application on Zerops: the generated start script's steps,
  # then the generated entrypoint, with the variables the deploy writes (`prepare.ts` generates the local ones).
  # `followNotesDeploy` points it at another fixture commit the emulator activated (`src/notes-follow.ts`).
  notes:
    <<: *bun
    # The application image: Bun with ClamAV, so a `scan: true` collection's scan job finds its scanner.
    image: fabrika-local-app:clamav
    build: app-image
    working_dir: ${FABRIKA_LOCAL_NOTES_ROOT:-/workspace/examples/zerops-app}
    # The generated start script's steps, with the source's own `fabrika` as the platform runs it: a release fixture
    # (`local:compat`) migrates and checks with the framework it pins.
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/fabrika db migrate &&
        ./node_modules/.bin/fabrika db codegen --verify &&
        ./node_modules/.bin/fabrika db test-isolation &&
        exec bun fabrika/entry.generated.ts
    # `notes-workloads.env` holds the jobs' and webhooks' keys (`workload-keys.ts`), `notes-membership.env` IAM's
    # membership transport (`membership-key.ts`); `up` writes both before Notes starts.
    env_file:
      - .state/notes.env
      - .state/notes-contract.env
      - path: .state/notes-workloads.env
        required: false
      - path: .state/notes-membership.env
        required: false
    environment:
      PORT: "3000"
      FABRIKA_APP_ID: notes
      FABRIKA_IAM_ISSUER: http://iam.fabrika.localhost:18080
      FABRIKA_IAM_APP_ID: notes@prod
      FABRIKA_OPERATIONS_DSN: http://00000000000000000000000000000000@errors.fabrika.localhost:18080/1
      FABRIKA_RELEASE: fabrika/local-notes/local/default/0000000000000000000000000000000000000000
    networks: [apps-prod, iam-public]
    depends_on:
      apps-db:
        condition: service_healthy
      apps-storage:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/healthz]
      interval: 2s
      timeout: 2s
      retries: 60

  apps-proxy-auth:
    <<: *bun
    command: bun packages/proxy/src/main.ts
    env_file:
      - .state/apps-proxy.env
      - .state/apps-proxy-secret.env
    environment:
      FABRIKA_PROXY_MANIFEST: /local-state/apps-proxy.manifest.json
      FABRIKA_PROXY_PORT: "9000"
      FABRIKA_IAM_ISSUER: http://iam.fabrika.localhost:18080
    volumes:
      - ../..:/workspace
      - ./.state:/local-state:ro
    networks:
      apps-prod: {}
      edge: {}
    ports:
      - 127.0.0.1:18081:18081
    depends_on:
      notes:
        condition: service_healthy
      platform-proxy-auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9000/healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  apps-proxy:
    image: caddy:2.10.2-alpine
    command: caddy run --config /local-state/apps-caddy.json
    # Caddy reads each application's proxy secret from its environment (`{env.FABRIKA_PROXY_SECRET_…}`) and sends it upstream.
    env_file: .state/apps-proxy-secret.env
    network_mode: service:apps-proxy-auth
    volumes:
      - ./.state:/local-state:ro
    depends_on:
      apps-proxy-auth:
        condition: service_healthy

networks:
  platform:
    internal: true
  apps-prod:
    internal: true
  edge: {}
  iam-public: {}

volumes:
  platform-db: {}
  apps-db: {}
  apps-storage: {}
  object-storage: {}
  # Retained only so an explicit reset can remove the legacy volume too.
  minio: {}
  zerops-state: {}
