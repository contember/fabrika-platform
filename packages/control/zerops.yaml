# The CONTROL PLANE on Zerops — build, deploy and run descriptor for `@fabrika/control`.
#
# WHERE THIS FILE GOES. Zerops reads `zerops.yaml` from the REPOSITORY ROOT. It is kept here, next to
# the service it describes, because not every fabrika service is ported yet; the format is a list keyed
# by `setup:` precisely so several services share one file. `packages/iam/zerops.yaml` and
# `packages/proxy/zerops.yaml` are the other two blocks. MERGING THEM IS A SEPARATE, DELIBERATE STEP —
# concatenate the three `- setup:` entries into one root `zerops.yaml` when an environment first needs
# more than one of them. Do not edit a sibling package's file to do it; each stays the source for its
# own block.
#
# `setup` must equal the Zerops service HOSTNAME, and the hostname is also how other services address it
# on the project's private network (`http://vozka:3000`). Renaming the service renames the address.
#
# Fields here are the ones the published JSON schema accepts
# (https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json). Note that the
# prose docs still describe `run.os`/`build.os` and a `mode` key; the schema marks them DEPRECATED in
# favour of an OS-qualified base (`alpine/bun@1.3`), which is what this file uses.
#
# ── WHAT IS NOT HERE, BY DECISION ─────────────────────────────────────────────────────────────────
#
# NO DEPLOY RUNNER. On Cloudflare the control plane hands each run to `vozka-runner`, a second Worker
# that boots a container, because `wrangler deploy` needs a filesystem. Zerops has its own CI, so the
# platform executes the deploy and there is nothing for a runner to do — ADR-0003. `RUNNER_SVC` and the
# container image are Cloudflare-only, and `startRun` (src/services.ts) fails loudly if a
# Cloudflare-shaped deploy is somehow triggered here, rather than half-running one.
#
# ── SECRETS ───────────────────────────────────────────────────────────────────────────────────────
#
# `envVariables` below is COMMITTED PLAINTEXT, so every credential is set as a service-level `envSecret`
# (GUI or import YAML) and never appears here — see ADR-0004, secrets live in the platform:
#
#   VOZKA_VAULT_KEY                 The vault master key (KEK), 32 random bytes base64. Seals every
#                                   per-value data key. LOSING IT MAKES EVERY VAULT VALUE
#                                   UNRECOVERABLE, by design. Generate once per environment:
#                                   `head -c 32 /dev/urandom | base64`.
#   PROPUSTKA_RPC_KEY               The shared secret gating IAM's `/rpc/*` surface. THE SAME VALUE the
#                                   IAM service holds under the same name — it is one secret with two
#                                   holders, not two secrets. Minimum 32 characters; a shorter one
#                                   fails this service's boot. Unset it and IAM 404s the surface, so
#                                   every `/api/*` request here fails closed.
#   PROPUSTKA_PROVISIONING_KEY      The seeded propustka provisioning `px_` key. Two jobs: it is
#                                   injected into every deploy that reconciles a schema, and a request
#                                   bearing it is admitted here as a synthetic global admin (the
#                                   machine analog of VOZKA_BOOTSTRAP_ADMINS). Empty disables the hatch.
#   GITHUB_APP_PRIVATE_KEY          The GitHub App PEM key — signs the App JWT that mints clone tokens.
#   GITHUB_WEBHOOK_SECRET           HMAC-verifies inbound `POST /webhooks/github`, the only
#                                   unauthenticated route.
#   CLOUDFLARE_API_TOKEN            The account-wide token fabrika deploys Cloudflare apps with.
#   VOZKA_RUN_LOGS_ACCESS_KEY_ID    Object-storage credentials for the run-log bucket. On Zerops these
#   VOZKA_RUN_LOGS_SECRET_ACCESS_KEY   come from the object-storage service's own generated variables
#                                   and should be set as REFERENCES (`${<hostname>_...}`), never as
#                                   literals. CONFIRM THE EXACT KEY NAMES against the object-storage
#                                   service's variable list before wiring them — the public docs this
#                                   repo has verified (docs/reference/zerops-platform.md) document the
#                                   cross-service reference MECHANISM but not object storage's keys.
#
# ── THE DATABASE ──────────────────────────────────────────────────────────────────────────────────
#
# `${db_connectionString}` references the `db` PostgreSQL service in the same project — the DIRECT port
# (5432), not pgBouncer on 6432. That is load-bearing: the migration runner takes a session-level
# advisory lock so two booting containers cannot migrate at once, and pgBouncer's transaction pooling
# does not preserve session state across statements.
#
# The control plane and IAM may share one Postgres SERVER but must not share a database/schema — they
# own disjoint schemas and separate migration ledgers (their advisory-lock keys differ so their boots
# do not serialize against each other).

zerops:
  - setup: vozka

    build:
      # Bun on Alpine. `build.os` is deprecated — the OS is part of the base identifier now.
      base: alpine/bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
        # The dashboard SPA. Its output (`packages/dashboard/dist`) is what the service serves for every
        # non-API path — the replacement for Cloudflare's ASSETS binding.
        - bun run --filter @fabrika/dashboard build
      # Whole top-level directories, on purpose. The workspace links `node_modules/@fabrika/*` at
      # `packages/*`, so copying `node_modules` and `packages` as complete trees keeps those links
      # resolvable whether the platform preserves symlinks or dereferences them. Listing the leaf
      # packages individually would break on the dereferencing case.
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - packages
      cache:
        - node_modules

    run:
      base: alpine/bun@1.3

      # Migrations run at container start — the Zerops analog of `wrangler d1 migrations apply` in a
      # Cloudflare deploy. Safe to repeat: the runner records what it applied and serializes concurrent
      # containers behind an advisory lock, so every start after the first is a no-op. Runs in /var/www.
      initCommands:
        - bun packages/control/src/node/migrate.ts

      start: bun packages/control/src/node/server.ts

      ports:
        - port: 3000
          protocol: TCP
          # The project's L7 balancer terminates TLS and forwards plain HTTP over the private network,
          # so the process holds no certificates and speaks HTTP on this port. The `px_token` cookie is
          # still marked `Secure` — src/iam.ts decides that from VOZKA_DOMAIN, not from the socket.
          httpSupport: true

      # Liveness, not readiness: it answers "is this process serving?" and never touches Postgres. A
      # health check that queried the database would let one slow query restart every container at once,
      # turning a degraded dependency into an outage.
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz

      # The `scheduled` handler's replacement. `triggers.crons` on Cloudflare, platform cron here — same
      # schedule, same code path (`src/cron.ts`): poll public repos for new commits, then sweep orphaned
      # runs. `allContainers: false` so a horizontally scaled service polls once; both operations
      # tolerate an overlapping run anyway.
      crontab:
        - timing: '*/5 * * * *'
          command: bun packages/control/src/node/cron.ts
          allContainers: false

      envVariables:
        PORT: 3000
        # Direct Postgres (5432), not pgBouncer — see the header.
        VOZKA_DATABASE_URL: ${db_connectionString}
        # The built dashboard SPA, relative to /var/www.
        VOZKA_ASSETS_DIR: packages/dashboard/dist
        ENVIRONMENT: prod
        # Empty selects the real auth path (`PropustkaAuth` over HTTP). 'true' would select the local
        # dev-persona fake, which authorizes everyone — never set it here.
        DEV: ''
        # The public domain routed to this service. ALSO the authority on whether the browser spoke
        # HTTPS, which is what keeps the `px_token` cookie `Secure` behind the TLS-terminating balancer
        # (the process only ever sees plain HTTP, so the socket is the wrong signal).
        VOZKA_DOMAIN: vozka.example.com
        # The IAM service on the project's PRIVATE network — `iam` is its `setup:`/hostname. Two roles:
        # the `HttpIamRpc` transport target, and the token `iss` PropustkaAuth verifies against.
        PROPUSTKA_URL: http://iam:3000
        # Normally empty; set for the FIRST operator, then emptied.
        VOZKA_BOOTSTRAP_ADMINS: '[]'
        # Run logs. R2 on Cloudflare, the project's object storage (MinIO) here — one S3 implementation
        # covers both, so only the endpoint and the credentials differ. The credentials are envSecrets.
        VOZKA_RUN_LOGS_BUCKET: vozka-run-logs
        VOZKA_RUN_LOGS_ENDPOINT: ${storage_apiUrl}
        VOZKA_RUN_LOGS_REGION: auto
        # Cloudflare deploy config: fabrika deploys Cloudflare apps FROM here even when it runs on
        # Zerops, so the account id rides as a var and the token as an envSecret. Leave empty in an
        # installation that deploys nothing to Cloudflare — `assembleJob` then fails such a run loudly
        # instead of deploying with a blank credential.
        CLOUDFLARE_ACCOUNT_ID: ''
        # The GitHub App's numeric id (public). The PEM key is an envSecret.
        GITHUB_APP_ID: ''
