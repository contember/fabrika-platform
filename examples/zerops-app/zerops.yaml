# The build/run descriptor for this app, at ITS repository root.
#
# Zerops reads `zerops.yaml` from the root of the repository it builds, so in a real deployment this
# file sits beside `package.json` at the top of the app's own repo. It lives here because this example
# IS that repo, checked into fabrika's monorepo for convenience — the paths below are relative to this
# directory, and copying the directory somewhere else needs no path changes.
#
# `setup` must match the service hostname (`notesapi`), which is also what `zeropsSetup` in
# `fabrika.config.ts` selects. One setup here, because one service in this repo carries code; the
# `notesdb` PostgreSQL service is provisioned by the import document and has nothing to build.
#
# Hand-written, unlike fabrika's own root `zerops.yaml` (which is generated from
# `packages/installation-zerops/zerops/setups.ts`). The line between them: generate a file that must AGREE with something
# else — fabrika's has to stay in step with the hostnames in its import documents — and write by hand a
# file that stands alone, which is every app's. Both are validated against Zerops' published
# `zerops.yaml` JSON schema by `packages/installation-zerops/zerops/__tests__/zerops-yaml.test.ts`, so "hand-written" does not
# mean "unchecked".
#
# ── Where the secrets are ──────────────────────────────────────────────────────────────────────────
#
# Not here. This file is committed and plaintext, so it carries only what is true for every deployment
# of this app: ports, and `${service_variable}` REFERENCES that the platform resolves at container
# start. Two categories live elsewhere, both addressed BY SERVICE through the env API (ADR-0004):
#
#   per-environment config   FABRIKA_IAM_ISSUER   the IAM service's public origin — the `iss` of every
#                                                 token this app verifies, and the JWKS it fetches.
#                                                 Differs per installation, so it is not committed;
#                                                 `src/env.ts` refuses to boot without it.
#   secrets                  NOTES_SESSION_PEPPER, NOTES_WEBHOOK_SIGNING_KEY — declared in
#                                                 `fabrika.config.ts` under `pipeline.secrets` purely as
#                                                 documentation. Nothing in fabrika transports their
#                                                 values on Zerops; the platform holds them.

zerops:
  - setup: notesapi

    build:
      # Bun on Alpine. `build.os` is deprecated in the published schema — the OS is part of the base id.
      base:
        - alpine/bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
      # `node_modules` is deployed rather than reinstalled at runtime: the runtime container has no
      # network guarantee and no package manager step, and the build container already resolved
      # everything against the committed lockfile.
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - src
      cache:
        - node_modules

    # The DEPLOY GATE, which `run.healthCheck` below is not. It decides whether this new version may take
    # traffic at all: a build that comes up and never answers `/healthz` ends `DEPLOY_FAILED` and the
    # previous version keeps serving, instead of being given traffic and then restart-looping. Verified
    # against a live account.
    #
    # It points at the same path as the liveness check on purpose. The question a deploy gate has to
    # answer here is "did this build start answering HTTP" — the database is already gated one step
    # earlier, because a failing `run.initCommands` migration aborts the deploy before any check runs.
    #
    # Every duration is a QUOTED Go duration and none is under 10s. The published JSON schema types these
    # as integers and the platform refuses an integer (`cannot unmarshal !!int into time.Duration`); it
    # also rejects anything outside [10s, 1h]. Both verified live — see docs/reference/zerops-platform.md.
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /healthz
        retryPeriod: 10s
        # Covers a cold container plus `bun src/migrate.ts`. Generous on purpose: too short fails the
        # deploy of a build that was fine.
        failureTimeout: 180s

    run:
      base: alpine/bun@1.3

      # Migrations run at CONTAINER START, which is why the Zerops deploy plan has no `migrate` step at
      # all. Safe to repeat and safe to run concurrently: the statements are idempotent and the runner
      # takes a session-level advisory lock on the DIRECT Postgres port, so two containers booting at
      # once cannot both migrate.
      initCommands:
        - bun src/migrate.ts

      start: bun src/server.ts

      ports:
        # `protocol` is omitted deliberately: TCP is the default at both ends, and the two published
        # sources disagree about its spelling (the JSON schema's enum is lowercase `tcp`, while its own
        # description and every doc example say `TCP`).
        - port: 3000
          # The project's L7 balancer terminates TLS and the proxy forwards plain HTTP over the private
          # network, so this process holds no certificates.
          httpSupport: true

      # Liveness, not readiness: it answers "is this process serving?" and never touches Postgres. A
      # health check that queried the database would let one slow query restart every container at once,
      # turning a degraded dependency into an outage. `/healthz` is also a `public` gate — the check
      # arrives with no credential and must not be answered with a 401.
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
        # Written out rather than defaulted, and asymmetric on purpose: probe at the platform's 10s floor,
        # take the container out of the balancer after three consecutive misses, put it back after one
        # success, and only RESTART after two minutes down. Disconnecting is cheap and reversible;
        # restarting is neither, and a short failureTimeout turns one slow dependency into a rolling
        # restart of every container at once.
        execPeriod: 10s
        disconnectTimeout: 30s
        recoveryTimeout: 10s
        failureTimeout: 120s

      envVariables:
        PORT: "3000"
        # The DIRECT Postgres port (5432), not pgBouncer on 6432: the migration lock is session-level and
        # pgBouncer's transaction pooling does not preserve session state across statements. `${notesdb_…}`
        # is a reference to the `notesdb` service's own variable — the value never appears in this file.
        #
        # The DATABASE and the TLS MODE are named rather than inherited from the driver, and both matter.
        # `connectionString` is `postgresql://${user}:${password}@${hostname}:${port}` with no database
        # path, so without `/${notesdb_dbName}` the driver falls back to the user name — which happens to
        # be right, because every Zerops PostgreSQL service names its database and its user `db` whatever
        # the service is called. And 5432 does speak TLS, contrary to the published documentation:
        # `sslmode=require` connects encrypted, `verify-full` fails on a self-signed certificate.
        NOTES_DATABASE_URL: ${notesdb_connectionString}/${notesdb_dbName}?sslmode=require
        # Must equal `id` in fabrika.config.ts and the `aud` of every token minted for this app.
        NOTES_APP_ID: notes
