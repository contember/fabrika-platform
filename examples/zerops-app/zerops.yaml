# The build descriptor Zerops reads from the repository root. A contract application authors only `setup`,
# `build.base`, `build.os` and an SPA's `build.buildCommands`: the platform generates the rest of the build (install,
# tests, the checker, the type check), the deploy gate and the whole run section — the start script runs
# `fabrika db migrate`, `fabrika db codegen --verify` and `fabrika db test-isolation` before the server, and the
# crontab runs `fabrika job run purge` (ADR-0043). Any other key is refused at build.
#
# `setup` is the runtime's hostname, which `zeropsSetup` in fabrika.config.ts selects. The SPA commands run first and
# write `dist/web`, which the contract's `site` mount serves.

zerops:
  - setup: notesapi
    build:
      base: alpine/bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
        - bun run build:web
