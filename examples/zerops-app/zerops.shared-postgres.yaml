# Cheap-tier variant. Copy this file to `zerops.yaml` in an app repository that consumes the
# namespace-owned `postgres` service declared by `useSharedPostgres()`.

zerops:
  - setup: notesapi
    build:
      base:
        - alpine/bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - src
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /healthz
        retryPeriod: 10s
        failureTimeout: 180s
    run:
      base: alpine/bun@1.3
      initCommands:
        - bun src/migrate.ts
      start: bun src/server.ts
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
        execPeriod: 10s
        disconnectTimeout: 30s
        recoveryTimeout: 10s
        failureTimeout: 120s
      envVariables:
        PORT: "3000"
        # Must match `useSharedPostgres()` exactly — a test asserts it. See the sibling zerops.yaml for
        # why the TLS port, the database and the TLS mode are named rather than left to the driver.
        NOTES_DATABASE_URL: ${postgres_connectionTlsString}/${postgres_dbName}?sslmode=require
        NOTES_APP_ID: notes
