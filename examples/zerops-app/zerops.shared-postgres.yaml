# Cheap-tier variant. Copy this file to `zerops.yaml` in an app repository that consumes the
# namespace-owned `postgres` service declared by `useSharedPostgres()`.

zerops:
  - setup: notesapi
    build:
      base:
        - alpine/bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - src
      cache:
        - node_modules
    run:
      base: alpine/bun@1.3
      initCommands:
        - bun src/migrate.ts
      start: bun src/server.ts
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
      envVariables:
        PORT: "3000"
        NOTES_DATABASE_URL: ${postgres_connectionString}
        NOTES_APP_ID: notes
