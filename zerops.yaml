# GENERATED FILE — DO NOT EDIT BY HAND.
#
# Source: packages/installation-zerops/zerops/setups.ts  (which is where the per-field commentary lives)
# Regenerate: bun run --filter @fabrika/installation-zerops gen
#
# Zerops reads `zerops.yaml` from the REPOSITORY ROOT, so fabrika's four deployable services share
# ONE file with four named setups. A service selects its setup by name; the name defaults to the
# service hostname, which is why `iam`, `operations`, `control` and `proxy` below are also hostnames in
# packages/installation-zerops/zerops/generated/*.zerops-import.yaml.
#
# NO SECRETS AND NO PER-INSTALLATION VALUES ARE IN HERE. `${x_y}` is a REFERENCE to another
# service's platform-held variable, never a value. Public origins, OIDC coordinates and every
# secret are service-level variables written through the env API (ADR-0004).
#
zerops:
  - setup: iam
    build:
      base:
        - alpine/bun@1.3
      buildCommands:
        - "bun install --frozen-lockfile"
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - packages
      cache:
        - node_modules
    run:
      base: alpine/bun@1.3
      initCommands:
        - "bun packages/iam/src/node/migrate.ts"
      start: "bun packages/iam/src/node/server.ts"
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: "/healthz"
      crontab:
        - timing: "0 3 * * *"
          command: "bun packages/iam/src/node/prune.ts"
          allContainers: false
      envVariables:
        PORT: "3000"
        FABRIKA_IAM_DATABASE_URL: "${db_connectionString}"
        ENVIRONMENT: prod
  - setup: operations
    build:
      base:
        - alpine/bun@1.3
      buildCommands:
        - "bun install --frozen-lockfile"
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - packages
      cache:
        - node_modules
    run:
      base: alpine/bun@1.3
      initCommands:
        - "bun packages/operations/src/node/migrate.ts"
      start: "bun packages/operations/src/node/server.ts"
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: "/healthz"
      crontab:
        - timing: "* * * * *"
          command: "bun packages/operations/src/node/cron.ts"
          allContainers: false
      envVariables:
        PORT: "3000"
        ENVIRONMENT: prod
        FABRIKA_OPERATIONS_DATABASE_URL: "${operationsdb_connectionString}"
        FABRIKA_OPERATIONS_BLOB_BUCKET: "${operationsstorage_bucketName}"
        FABRIKA_OPERATIONS_BLOB_ENDPOINT: "${operationsstorage_apiUrl}"
        FABRIKA_OPERATIONS_BLOB_ACCESS_KEY_ID: "${operationsstorage_accessKeyId}"
        FABRIKA_OPERATIONS_BLOB_SECRET_ACCESS_KEY: "${operationsstorage_secretAccessKey}"
        FABRIKA_OPERATIONS_BLOB_REGION: us-east-1
        FABRIKA_IAM_RPC_URL: "http://iam:3000"
        FABRIKA_CONTROL_URL: "http://control:3000"
  - setup: control
    build:
      base:
        - alpine/bun@1.3
      buildCommands:
        - "bun install --frozen-lockfile"
        - "bun run --filter @fabrika/dashboard build"
      deployFiles:
        - package.json
        - bun.lock
        - node_modules
        - packages
      cache:
        - node_modules
    run:
      base: alpine/bun@1.3
      initCommands:
        - "bun packages/control/src/node/migrate.ts"
      start: "bun packages/control/src/node/server.ts"
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: "/healthz"
      crontab:
        - timing: "*/5 * * * *"
          command: "bun packages/control/src/node/cron.ts"
          allContainers: false
      envVariables:
        PORT: "3000"
        FABRIKA_CONTROL_DATABASE_URL: "${db_connectionString}"
        FABRIKA_CONTROL_ASSETS_DIR: packages/dashboard/dist
        ENVIRONMENT: prod
        FABRIKA_IAM_RPC_URL: "http://iam:3000"
        FABRIKA_OPERATIONS_URL: "http://operations:3000"
        FABRIKA_CONTROL_RUN_LOGS_BUCKET: "${storage_bucketName}"
        FABRIKA_CONTROL_RUN_LOGS_ENDPOINT: "${storage_apiUrl}"
        FABRIKA_CONTROL_RUN_LOGS_ACCESS_KEY_ID: "${storage_accessKeyId}"
        FABRIKA_CONTROL_RUN_LOGS_SECRET_ACCESS_KEY: "${storage_secretAccessKey}"
        FABRIKA_CONTROL_RUN_LOGS_REGION: us-east-1
  - setup: proxy
    build:
      base:
        - alpine/go@latest
        - alpine/bun@1.3
      prepareCommands:
        - "CGO_ENABLED=0 GOBIN=/tmp/gobin go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.10.2"
      buildCommands:
        - "bun install --frozen-lockfile"
        - "printf %s \"${FABRIKA_PROXY_MANIFEST_JSON}\" > ./proxy.manifest.json"
        - "bun run packages/proxy/src/generate-config.ts ./proxy.manifest.json ./caddy.json --auth-upstream 127.0.0.1:9000"
        - "bun build --compile --target=bun-linux-x64-musl ./packages/proxy/src/main.ts --outfile ./fabrika-proxy"
        - "cp /tmp/gobin/caddy ./caddy"
      deployFiles:
        - caddy
        - fabrika-proxy
        - caddy.json
        - proxy.manifest.json
        - packages/proxy/start.sh
      cache:
        - node_modules
        - "/root/go/pkg/mod"
    run:
      base: alpine@3.21
      ports:
        - port: 8080
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8081
          path: "/healthz"
      envVariables:
        FABRIKA_PROXY_MANIFEST: "/var/www/proxy.manifest.json"
        FABRIKA_PROXY_PORT: "9000"
      start: "sh /var/www/packages/proxy/start.sh"
