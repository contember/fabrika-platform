# `bun run check:ci` (scripts/check-ci.ts) runs these steps locally; scripts/__tests__/check-ci.test.ts keeps the two equal.
name: CI

on:
  push:
    branches: [main, 'channel/**']
  pull_request:
    branches: [main, 'channel/**']
  workflow_call:
  # Nightly, the test matrix adds every other supported PostgreSQL major.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  # The event keeps a push to main from cancelling the nightly run of main, and the other way round.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # A warm cache installs without the network: registry stalls cost up to 5 min of a 10-min job.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck the examples with their own TypeScript
        run: bun run --filter 'fabrika-example-*' typecheck

      - name: Check generated Zerops artifacts
        run: bun run --filter @fabrika/platform-artifacts gen:check

  test:
    name: Test shard ${{ matrix.shard }}/4 with PostgreSQL ${{ matrix.postgres }} and S3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The gate (pull requests, pushes, release tags) runs the major Zerops runs. The nightly run adds 17, the local
        # stack's major; `pg-catalog-names.ts` is the union of both.
        postgres: ${{ fromJSON(github.event_name == 'schedule' && '["17","18"]' || '["18"]') }}
        # The serial main suite takes 10–16 minutes on one runner; `--shard` with `--timings` splits its files by measured time.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FABRIKA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FABRIKA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FABRIKA_TEST_S3_BUCKET: fabrika-test
      FABRIKA_TEST_S3_ACCESS_KEY_ID: fabrika-test
      FABRIKA_TEST_S3_SECRET_ACCESS_KEY: fabrika-test-secret
      FABRIKA_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A test database needs no durability. With it, a commit that drops a relation waits for a WAL flush, which during a
      # checkpoint on a busy disk took seconds and timed out DDL-heavy Postgres suites. All three settings reload.
      - name: Run the test Postgres without durability
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'alter system set fsync = off' \
            -c 'alter system set full_page_writes = off' \
            -c 'alter system set synchronous_commit = off' \
            -c 'select pg_reload_conf()'

      - name: Start SeaweedFS
        run: |
          docker run --detach --name fabrika-test-s3 --publish 127.0.0.1:9000:9000 \
            --env AWS_ACCESS_KEY_ID="$FABRIKA_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$FABRIKA_TEST_S3_SECRET_ACCESS_KEY" \
            --env S3_BUCKET="$FABRIKA_TEST_S3_BUCKET" \
            chrislusf/seaweedfs:4.42 mini -dir=/data -s3.port=9000 \
            -s3.autoCreateBucket=false -master.telemetry=false

          for attempt in {1..30}; do
            if docker exec fabrika-test-s3 curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/fabrika-test/?limit=1'; then
              break
            fi
            echo "Waiting for SeaweedFS bucket (${attempt}/30)"
            sleep 1
          done
          docker exec fabrika-test-s3 curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/fabrika-test/?limit=1'

      # `test-timings.json` holds each file's measured duration (`bun run test:timings`), so the shards split by time.
      - name: Run a shard of the main suite
        run: bun run test:unit --shard=${{ matrix.shard }}/4 --timings=test-timings.json

      # The isolated suites, spread over the shards by their measured time (36, 25, 13 and 10 s).
      - name: Run the builder suite
        if: matrix.shard == 1
        run: bun run test:builder

      - name: Run the Lopata suites
        if: matrix.shard == 2
        run: bun run test:lopata

      - name: Run the agent-interface and DOM suites
        if: matrix.shard == 3
        run: bun run test:agent-interfaces && bun run test:dom

      - name: Run the example suites
        if: matrix.shard == 4
        run: bun run test:examples

  build:
    name: Build deployable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run --filter @fabrika/dashboard build

      - name: Build proxy
        run: bun run --filter @fabrika/proxy build:check

  # The namespace proxy's image, as the AWS build makes it: the commit's archive plus a compiled manifest, built by
  # `packages/proxy/Dockerfile` for linux/amd64 and started once. Nothing is pushed and no registry is logged in to.
  proxy-image:
    name: Build the proxy image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and start the proxy image
        run: bun run --filter @fabrika/provider-aws proxy-image:check

  platform-image:
    name: Build the AWS platform services' image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the platform services' image and check what it holds
        run: bun run --filter @fabrika/provider-aws platform-image:check

  release-artifacts:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack public packages
        run: bun run release:pack --tag=v0.0.0-ci.0

      - name: Test tarballs in an isolated consumer
        run: bun run release:smoke --tag=v0.0.0-ci.0

      - name: Verify npm publish inputs
        run: bun run release:publish --tag=v0.0.0-ci.0 --dry-run
