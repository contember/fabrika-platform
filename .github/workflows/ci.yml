# `bun run check:ci` (scripts/check-ci.ts) runs these steps locally; scripts/__tests__/check-ci.test.ts keeps the two equal.
name: CI

on:
  push:
    branches: [main, 'channel/**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated Zerops artifacts
        run: bun run --filter @fabrika/platform-artifacts gen:check

  test:
    name: Test with PostgreSQL ${{ matrix.postgres }} and S3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported major: Zerops runs 18, and `pg-catalog-names.ts` is the union of these.
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FABRIKA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FABRIKA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FABRIKA_TEST_S3_BUCKET: fabrika-test
      FABRIKA_TEST_S3_ACCESS_KEY_ID: fabrika-test
      FABRIKA_TEST_S3_SECRET_ACCESS_KEY: fabrika-test-secret
      FABRIKA_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start SeaweedFS
        run: |
          docker run --detach --name fabrika-test-s3 --publish 127.0.0.1:9000:9000 \
            --env AWS_ACCESS_KEY_ID="$FABRIKA_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$FABRIKA_TEST_S3_SECRET_ACCESS_KEY" \
            --env S3_BUCKET="$FABRIKA_TEST_S3_BUCKET" \
            chrislusf/seaweedfs:4.42 mini -dir=/data -s3.port=9000 \
            -s3.autoCreateBucket=false -master.telemetry=false

          for attempt in {1..30}; do
            if docker exec fabrika-test-s3 curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/fabrika-test/?limit=1'; then
              break
            fi
            echo "Waiting for SeaweedFS bucket (${attempt}/30)"
            sleep 1
          done
          docker exec fabrika-test-s3 curl -fsS -o /dev/null 'http://127.0.0.1:8888/buckets/fabrika-test/?limit=1'

      - name: Run full test suite
        run: bun run test

  build:
    name: Build deployable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run --filter @fabrika/dashboard build

      - name: Build proxy
        run: bun run --filter @fabrika/proxy build:check

  release-artifacts:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack public packages
        run: bun run release:pack --tag=v0.0.0-ci.0

      - name: Test tarballs in an isolated consumer
        run: bun run release:smoke --tag=v0.0.0-ci.0

      - name: Verify npm publish inputs
        run: bun run release:publish --tag=v0.0.0-ci.0 --dry-run
