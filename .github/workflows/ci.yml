name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated Zerops artifacts
        run: bun run --filter @fabrika/installation-zerops gen:check

  test:
    name: Test with PostgreSQL and S3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FABRIKA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FABRIKA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FABRIKA_TEST_S3_BUCKET: fabrika-test
      FABRIKA_TEST_S3_ACCESS_KEY_ID: minioadmin
      FABRIKA_TEST_S3_SECRET_ACCESS_KEY: minioadmin
      FABRIKA_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run --detach --name fabrika-test-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            echo "Waiting for MinIO (${attempt}/30)"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null

          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb local/fabrika-test'

      - name: Run full test suite
        run: bun test

  build:
    name: Build deployable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run --filter @fabrika/dashboard build

      - name: Build proxy
        run: bun run --filter @fabrika/proxy build:check

  release-artifacts:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack public packages
        run: bun run release:pack --tag=v0.0.0-ci.0

      - name: Test tarballs in an isolated consumer
        run: bun run release:smoke --tag=v0.0.0-ci.0

      - name: Verify npm publish inputs
        run: bun run release:publish --tag=v0.0.0-ci.0 --dry-run
