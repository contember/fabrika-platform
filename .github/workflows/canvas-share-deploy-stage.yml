name: Deploy worker to stage

on:
  push:
    branches: [main]
    paths:
      - "packages/canvas-share/**"
      - "packages/agent-canvas/daemon/client/**"
      - "packages/agent-canvas/daemon/build.ts"
      - ".github/workflows/canvas-share-deploy.yml"
      - ".github/workflows/canvas-share-deploy-stage.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/canvas-share-deploy.yml
    with:
      env: stage
    # inherit so the reusable workflow can resolve secrets; the env-scoped
    # values (set on the `stage` environment) win over repo-level ones.
    secrets: inherit
